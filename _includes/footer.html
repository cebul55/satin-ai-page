<footer class="footer">
  <div class="footer__inner">
    <div class="footer__left">
      <span class="footer__name">{{ site.title }}</span>
      <span class="footer__description">{{ site.description }}</span>
    </div>
    <div class="footer__center">
      <!-- REPLACE WITH BUY ME A COFFEE LINK -->
      <a href="{{ site.buymeacoffee_url }}" class="btn btn--secondary btn--small" target="_blank" rel="noopener">Buy Me a Coffee</a>
    </div>
    <div class="footer__right">
      <span class="footer__made">{{ site.footer_tagline }}</span>
    </div>
  </div>
</footer>
