<section class="waitlist" id="waitlist">
  <div class="container">
    <h2 class="section-headline">{{ site.waitlist_headline }}</h2>
    <p class="waitlist__subtext">{{ site.waitlist_subtext }}</p>

    <!-- REPLACE WITH MAILCHIMP EMBED CODE -->
    <!-- Once you have your Mailchimp form, paste it here and remove the fallback form below -->

    <!-- Fallback static form — remove when Mailchimp is connected -->
    <form class="waitlist__form" action="#" method="post">
      <div class="waitlist__fields">
        <input type="text" name="name" placeholder="Your name" required class="waitlist__input">
        <input type="email" name="email" placeholder="Your email" required class="waitlist__input">
      </div>
      <button type="submit" class="btn btn--primary btn--submit">Join the Waitlist</button>
    </form>
  </div>
</section>
