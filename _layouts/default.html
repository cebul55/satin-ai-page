<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }} — {{ site.description }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
    (function () {
      var slides = document.querySelectorAll('.hero__slide');
      if (slides.length < 2) return;

      var dots = document.querySelectorAll('.hero__dot');
      var prevBtn = document.querySelector('.hero__arrow--prev');
      var nextBtn = document.querySelector('.hero__arrow--next');
      var current = 0;
      var timer;

      function goTo(index) {
        slides[current].classList.remove('hero__slide--active');
        dots[current].classList.remove('hero__dot--active');
        current = (index + slides.length) % slides.length;
        slides[current].classList.add('hero__slide--active');
        dots[current].classList.add('hero__dot--active');
      }

      function startAutoplay() {
        timer = setInterval(function () { goTo(current + 1); }, 5000);
      }

      function resetAutoplay() {
        clearInterval(timer);
        startAutoplay();
      }

      prevBtn.addEventListener('click', function () { goTo(current - 1); resetAutoplay(); });
      nextBtn.addEventListener('click', function () { goTo(current + 1); resetAutoplay(); });
      dots.forEach(function (dot, i) {
        dot.addEventListener('click', function () { goTo(i); resetAutoplay(); });
      });

      startAutoplay();
    })();
  </script>
</body>
</html>
